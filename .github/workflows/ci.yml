name: Check chat

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save mocked UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocked-ui-evidence
          path: |
            docs/screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 1
